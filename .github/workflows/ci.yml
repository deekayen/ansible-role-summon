---
name: CI
'on':
  pull_request:
  push:
    branches:
      - main

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip3 install ansible-lint flake8

      - name: Install required collections.
        run: ansible-galaxy collection install community.general

      - name: Lint code.
        run: ansible-lint --profile production

      - name: Lint Python tests.
        run: flake8 tests/

  macos:
    name: macOS
    runs-on: macos-latest
    # The cyberark/tools tap queries the GitHub API for every formula it
    # loads, which shared runners' rate limits reject, so CI skips the two
    # Homebrew tasks and tests the provider setup the role builds.
    env:
      ANSIBLE_SKIP_TAGS: homebrew
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: pip3 install ansible-core pytest-testinfra

      - name: Install required collections.
        run: ansible-galaxy collection install community.general

      - name: Make the role resolvable by its Galaxy name.
        run: mkdir -p .ansible/roles && ln -sfn "$PWD" .ansible/roles/deekayen.summon

      - name: Run the role.
        run: ansible-playbook -i tests/inventory tests/test.yml
        env:
          ANSIBLE_ROLES_PATH: .ansible/roles
          ANSIBLE_FORCE_COLOR: '1'

      - name: Run the role again to check idempotence.
        run: |
          ansible-playbook -i tests/inventory tests/test.yml | tee idempotence.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' idempotence.log
        env:
          ANSIBLE_ROLES_PATH: .ansible/roles

      - name: Verify with testinfra.
        run: py.test -v -k 'not summon_installed' tests/test_default.py
