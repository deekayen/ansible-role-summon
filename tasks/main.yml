---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

# Homebrew refuses to run as root, so only the /usr/local steps use become.
- name: Tap CyberArk tools.
  community.general.homebrew_tap:
    name: cyberark/tools
  tags:
    - homebrew

- name: Install Summon by CyberArk.
  community.general.homebrew:
    name: cyberark/tools/summon
    state: present
  tags:
    - homebrew

- name: Setup summon provider and keyring directories.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ summon_provider_dir }}"
    - "{{ summon_keyring_venv | dirname }}"
  become: true
  check_mode: false

# Homebrew's Python refuses pip installs (PEP 668) and lacks the packaging
# library the pip module needs, so build a dedicated virtualenv outside the
# provider directory with the venv and pip commands.
- name: Create the keyring virtualenv.
  ansible.builtin.command:
    cmd: /usr/bin/python3 -m venv {{ summon_keyring_venv }}
    creates: "{{ summon_keyring_venv }}/bin/python"
  become: true

- name: Check for the keyring library in the virtualenv.
  ansible.builtin.command: "{{ summon_keyring_venv }}/bin/python -c 'import keyring'"
  register: summon_keyring_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the keyring python library in the virtualenv.
  ansible.builtin.command: "{{ summon_keyring_venv }}/bin/python -m pip install keyring"
  become: true
  changed_when: true
  when: summon_keyring_check.rc | default(1) != 0

- name: Download the ring python script.
  ansible.builtin.get_url:
    url: "{{ summon_ring_url }}"
    dest: "{{ summon_provider_dir }}/ring.py"
    mode: "0755"
  become: true

# ring.py asks for "python", which current macOS does not provide.
- name: Run the ring script with the keyring virtualenv.
  ansible.builtin.lineinfile:
    path: "{{ summon_provider_dir }}/ring.py"
    regexp: '^#!'
    line: "#!{{ summon_keyring_venv }}/bin/python"
    insertbefore: BOF
    firstmatch: true
  become: true

# https://github.com/conjurinc/summon-keyring/commit/f954e6d12bfdd3b808e9668cbd0a0a6fe4a5bee4
# says naming it as keyring.py may make import conflicts.
